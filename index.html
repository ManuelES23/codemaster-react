<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/cm-icon-little.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>
      CodeMaster - Desarrollo Web, Apps Móviles y Soluciones Digitales
    </title>
    <meta
      name="description"
      content="CodeMaster ofrece desarrollo web profesional, aplicaciones móviles, sistemas a medida, gestión de redes sociales y licencias Microsoft. Transformamos tu negocio digitalmente."
    />
    <meta
      name="keywords"
      content="desarrollo web, aplicaciones móviles, apps, sistemas a medida, redes sociales, licencias microsoft, diseño web, e-commerce, páginas web, consultoría IT, hosting, cloud"
    />
    <meta name="author" content="CodeMaster" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.codemaster.com.mx/" />
    <meta
      property="og:title"
      content="CodeMaster - Soluciones Digitales Profesionales"
    />
    <meta
      property="og:description"
      content="Desarrollo web, apps móviles y sistemas personalizados para empresas. Desde Los Mochis, Sinaloa."
    />
    <meta
      property="og:image"
      content="https://www.codemaster.com.mx/img/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.codemaster.com.mx/" />
    <meta
      property="twitter:title"
      content="CodeMaster - Soluciones Digitales"
    />
    <meta
      property="twitter:description"
      content="Desarrollo web, apps móviles y sistemas personalizados para impulsar tu negocio."
    />
    <meta
      property="twitter:image"
      content="https://www.codemaster.com.mx/img/og-image.png"
    />

    <!-- Additional SEO -->
    <meta name="theme-color" content="#ff6600" />
    <link rel="canonical" href="https://www.codemaster.com.mx/" />

    <!-- Structured data: negocio local (estático, disponible sin ejecutar JS) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "CodeMaster",
        "image": "https://www.codemaster.com.mx/img/codemaster.png",
        "url": "https://www.codemaster.com.mx/",
        "email": "manuel@codemaster.com.mx",
        "telephone": "+52-668-131-6931",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Los Mochis",
          "addressRegion": "Sinaloa",
          "addressCountry": "MX"
        },
        "areaServed": "MX",
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "09:00",
          "closes": "18:00"
        },
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Desarrollo web" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Aplicaciones móviles" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Sistemas a medida" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Gestión de redes sociales" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Diseño gráfico" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Licencias Microsoft" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Consultoría IT" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Hosting y cloud" } }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
